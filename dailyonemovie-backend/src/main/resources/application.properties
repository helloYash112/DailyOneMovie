spring.application.name=dailyonemovie-backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# PostgreSQL driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


 #Server port (default 8080 if not set)
server.port=${PORT:8080}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB


# Backblaze B2 S3-compatible settings
#b2.endpoint=${B2_ENDPOINT}
#b2.bucketName=${B2_BUCKET_NAME}
#b2.accessKeyId=${B2_ACCESS_KEY_ID}
#b2.secretAccessKey=${B2_SECRET_ACCESS_KEY}


# Cloudflare R2

cloudflare.r2.bucket=${R2_BUCKET}
cloudflare.r2.endpoint=${R2_ENDPOINT}
cloudflare.r2.region=auto
cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}
cloudflare.r2.public-url=${R2_PUBLIC_URL}





spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

  

spring.security.oauth2.client.registration.github.scope=read:user,user:email

spring.security.oauth2.client.registration.github.client-name=GitHub


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.client-name=google


# Fixes cookie blocking between Netlify and Render
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true


server.forward-headers-strategy=native














